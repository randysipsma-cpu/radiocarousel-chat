name = "radiocarousel-irc-gateway-test"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Configure ALLOWED_ORIGINS in the Worker environment before deployment.
# Example: https://your-preview.pages.dev (exact origin, no trailing slash).

# Keep the allowed browser origin under version control across deployments.
[vars]
ALLOWED_ORIGINS = "https://radiocarousel-chat-test.pages.dev"

[durable_objects]
bindings = [{ name = "OBSERVER_HUB", class_name = "ObserverHub" }]

[[migrations]]
tag = "observer-hub-v1"
new_sqlite_classes = ["ObserverHub"]
