<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>RadioCarousel Chat</title><style>body{margin:0;background:#0b1020;color:#f4f5fa;font:16px system-ui}header{padding:18px;background:#161d32;display:flex;justify-content:space-between}main{max-width:820px;margin:auto;padding:16px}.panel{background:#171e33;padding:16px;border-radius:14px;margin-bottom:14px}input,button{padding:12px;border-radius:8px;border:1px solid #46506a;background:#252e48;color:white;font:inherit}button{background:#7254e8;cursor:pointer}button:disabled{opacity:.5}#messages{height:48vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}#messages p{margin:8px 0}form{display:flex;gap:8px}form input{flex:1;min-width:0}.muted{color:#aab5d0}#users{overflow-wrap:anywhere}a.camlink{display:inline-block;padding:12px 16px;border-radius:8px;background:#7254e8;color:white;text-decoration:none;font-weight:600}a.camlink:focus-visible{outline:3px solid white;outline-offset:3px}</style></head><body><header><strong>📻 RadioCarousel Chat</strong><span id="status">Niet verbonden</span></header><main><section class="panel"><label>Nickname <input id="nick" maxlength="24" autocomplete="nickname" placeholder="Jouw nickname"></label> <button id="connect">Verbinden</button><p class="muted">Kanaal: #radiocarousel · Bestaand ChattersNet-netwerk</p></section><section class="panel"><div id="messages" role="log" aria-live="polite"><p class="muted">Verbind om de chat te openen.</p></div><form id="send"><input id="message" maxlength="450" placeholder="Typ een bericht…" disabled><button id="sendbtn" disabled>Verstuur</button></form></section><section class="panel"><strong>Online gebruikers</strong><p id="users" class="muted">Nog niet beschikbaar</p></section><p class="muted">RadioCarousel Chat maakt via een beveiligde gateway verbinding met ChattersNet. </p></main><script src="app.js"></script></body></html>
